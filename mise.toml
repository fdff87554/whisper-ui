[tools]
python = "3.13"
node = "24"
uv = "0.11.8"
ruff = "0.15.8"
yamlfmt = "0.21.0"
shfmt = "3.13.0"
shellcheck = "0.11.0"
# Drives the hooks in .pre-commit-config.yaml. CI used pre-commit/action,
# which installs pre-commit with `python -m pip` -- and `python` there is the
# uv-created .venv, which has no pip. Pinned like every other tool here so CI
# and a local run use the same driver; the hook environments are pinned
# separately by the rev fields in .pre-commit-config.yaml.
pre-commit = "4.6.2"
taplo = "0.9.3"
"npm:prettier" = "3.8.1"
"npm:markdownlint-cli2" = "0.22.0"

[env]
_.python.venv = { path = ".venv", create = true }
# Optional: configure pip mirror in .mise.local.toml (not committed)
# PIP_INDEX_URL = "https://pypi.cs.nycu.edu.tw/simple/"

[tasks.css]
run = "npx @tailwindcss/cli -i src/whisper_ui/web/static/css/input.css -o src/whisper_ui/web/static/style.css --minify"
description = "Build production CSS"

[tasks."css:watch"]
run = "npx @tailwindcss/cli -i src/whisper_ui/web/static/css/input.css -o src/whisper_ui/web/static/style.css --watch"
description = "Watch and rebuild CSS on change"
