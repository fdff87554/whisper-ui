[project]
name = "whisper-ui"
version = "2.21.0"
description = "Speech-to-text system using OpenAI Whisper with speaker diarization and Docker GPU support"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.14.2,<3",
  "redis>=8.0.0,<9",
  "rq>=2.12.0,<3",
]

[project.optional-dependencies]
frontend = [
  "fastapi[standard]>=0.142.2,<1",
  "python-docx>=1.0,<2",
  "argon2-cffi>=25.1.0,<26",
  # SessionMiddleware needs itsdangerous to sign session cookies. It is
  # not a transitive dependency of fastapi[standard], so list it here.
  "itsdangerous>=2.0,<3",
  # /metrics endpoint (Prometheus exposition).
  "prometheus-client>=0.21,<1",
  # Submit-time playlist flat-extraction (web/playlist.py): metadata only,
  # media downloads stay in the worker.
  "whisper-ui[ytdlp]",
]
# Everything that talks to yt-dlp, in one place so the frontend and the worker
# cannot drift apart on it -- and so `dev` (which pulls frontend) installs the
# same set CI then checks. Keeping yt-dlp-ejs in the worker extra alone meant
# neither CI nor a dev checkout ever had it, and nothing in the suite noticed:
# the download tests mock yt-dlp out entirely.
ytdlp = [
  # Floor comes from the CVE-2026-55404 patch; this extra only collapses the
  # two previous declarations into one, it does not move the version.
  "yt-dlp>=2026.8.19",
  # The JavaScript challenge solvers. yt-dlp pins the exact version it needs
  # in its own [default]/[pin] extras; we depend on the package directly
  # because those extras drag in eight more packages this project does not
  # use, so test_ejs_matches_the_installed_yt_dlp checks the coupling instead
  # of the resolver. Without it every extraction reports "Signature solving
  # failed" and silently loses formats, because both call sites pass quiet.
  "yt-dlp-ejs>=0.7.0",
]
worker = [
  # whisperx is installed separately in Dockerfile (--no-deps) to avoid its
  # torch~=2.8.0 constraint conflicting with the base image's torch 2.10.0.
  # The dependencies below cover whisperx's runtime needs (minus torch/torchaudio).
  "faster-whisper>=1.1.1,<2",
  "ctranslate2>=4.8.0",
  "transformers>=5.18.0,<6",
  "nltk>=3.9.1",
  "numpy>=2.5.3",
  "omegaconf>=2.3.1",
  "pandas>=2.2.3",
  "pyannote.audio>=4.0.0",
  "opencc-python-reimplemented>=0.1.7",
  "whisper-ui[ytdlp]",
  "gdown>=6.1.0,<7",
]
# Optional LLM correction stage. Only required when OLLAMA_BASE_URL is set.
# Workers built without this extra still boot; the LLM stage is gated by the
# env var and httpx is imported lazily.
worker-llm = ["httpx>=0.27,<1"]
dev = [
  "whisper-ui[frontend,worker-llm]",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.0,<8",
  # Parses compose.yml in tests/unit/test_compose_env_wiring.py so the wiring
  # assertions can see which *service* an env key reaches, which a regex over
  # the file text cannot. Already present transitively; declared here because
  # a test must not rest on another package's dependency surviving.
  "pyyaml>=6.0,<7",
  # In-process Redis stand-in for the end-to-end integration test. Avoids
  # spinning up a real Redis or a Docker testcontainer in CI. The ``lua``
  # extra pulls in ``lupa`` so the RedisProgressReporter's EVAL-based
  # atomic max-write script (see whisper_ui/worker/progress.py) can be
  # exercised under fakeredis without a real Redis server.
  #
  # Held below 2.36.0: that release refactored CLIENT INFO so in-process
  # connections stop exposing 'addr', and RQ's Worker._set_ip_address reads
  # client['addr'] without catching KeyError, which breaks the SimpleWorker
  # burst tests. Drop the <2.36.0 cap and the matching .github/dependabot.yml
  # ignore once upstream restores the field (or RQ guards the lookup).
  "fakeredis[lua]>=2.35.1,<2.36.0",
  # Visual/contrast regression tests (tests/visual, `pytest -m visual`).
  # Renders the compiled stylesheet in a headless Chromium and reads computed
  # colors to guard theme contrast (issue #61). Browser binary is installed
  # separately via `playwright install chromium` (not a Python dependency).
  "pytest-playwright>=0.9.0,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"whisper_ui" = ["web/templates/**/*.html", "web/static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "C4",  # flake8-comprehensions
  "TC",  # flake8-type-checking
  "A",   # flake8-builtins
  "FA",  # flake8-future-annotations
  "T20", # flake8-print
  "RET", # flake8-return
  "PTH", # flake8-use-pathlib
  # The three flake8-bandit rules that catch a shell in the loop. Every
  # ffmpeg, whisper-cli and yt-dlp invocation here is list-form and carries
  # user-supplied text (a URL, a filename), so a shell appearing in that path
  # is the difference between an argument and a command. S603 ("untrusted
  # input in subprocess") is left off deliberately: it fires on the list-form
  # calls too, so it would mean a noqa on each one and a habit of adding more.
  "S602", # subprocess with shell=True
  "S604", # any call with shell=True
  "S605", # os.system
  # The S rules above only know about subprocess and os: asyncio's own shell
  # spawner goes unflagged by all three. Nothing here uses asyncio
  # subprocesses, so this bans a door rather than closing one. See
  # flake8-tidy-imports below for what it does and does not reach.
  "TID", # flake8-tidy-imports (TID251 banned-api)
]
ignore = ["RUF012"]

# TID251 resolves names through imports, so it catches both the qualified
# call and the from-import (including an aliased one). It cannot catch
# `loop.subprocess_shell(...)`: that is an attribute on a local variable and
# ruff has no type to resolve it from, so that form still needs review rather
# than lint.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_subprocess_shell".msg = "starts a shell; use create_subprocess_exec with an argument list"
"asyncio.subprocess.create_subprocess_shell".msg = "starts a shell; use create_subprocess_exec with an argument list"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["T20"]
# The copied conformance test carries `# noqa: BLE001` for a rule this
# project does not select, so RUF100 reads those comments as unused and
# `ruff check --fix` deletes them -- inside the hashed canonical region,
# which then stops matching here and only here. The file is shared and
# must stay byte-identical, so the noqa comments it needs for the
# siblings' rule sets are not unused, they are not ours. Every other
# rule still applies to it.
"tests/unit/test_ytdlp_conformance.py" = ["RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# The copied conformance test is excluded from the formatter, not the linter.
# The three projects sharing it do not share a line length -- this one uses
# 120, Youtube-Downloader and voice-forge use 88 -- so each one's `ruff format`
# would rewrite the shared region differently and its hash could never match
# in all three. Measured on the template: at 120, ruff format joins the call
# arguments in `_extractors_matching` and collapses the implicit string
# concatenation in `_load_profile`. `ruff check` still covers the file.
exclude = ["tests/unit/test_ytdlp_conformance.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests require ffmpeg on PATH and are excluded from the
# default run so unit tests stay fast. Run them explicitly with
# `pytest -m integration` (in CI's integration stage, for example).
markers = [
  "integration: end-to-end tests that exercise real I/O boundaries (ffmpeg, sqlite, filestore, fakeredis)",
  "visual: browser-rendered checks (Playwright + Chromium) on the compiled stylesheet; run with `pytest -m visual`",
]
# Both integration and visual tests need extra setup (ffmpeg / a Chromium
# browser), so the default run stays fast and pure-Python; trigger each
# explicitly with `pytest -m integration` / `pytest -m visual`.
addopts = "-m 'not integration and not visual'"

# The yt-dlp conformance profile. Every value is a claim that
# tests/unit/test_ytdlp_conformance.py checks against this repository's real
# code. The spec lives in Youtube-Downloader, docs/ytdlp-invariants.md.
[tool.ytdlp_conformance]
spec_version = "1.0.0"

# sha256 of the copied test's canonical region. Changing the region means
# changing this line, which is the visible part of the mechanism.
canonical_region_sha256 = "65ce3ac81219474f9ca8aa56cc8f4596f461a212147215a35186a6e00283d7fe"

# The union of the pins actually in use. This repository narrows the extractor
# per source rather than using one pin everywhere -- ["youtube"] for the
# YouTube download, ["twitter"] for the X download, ["youtube:tab"] for the
# playlist expansion -- which is stricter than a single shared pin, not looser.
# The shared test compares every call site against one declared value, so it
# reads the per-source pins as a mismatch; that gap is xfailed and tracked.
extractor_spec = ["youtube", "youtube:tab", "twitter"]

# C1's matrix, and C6 reuses it. canonicalize() here is validate_youtube_url.
accepts_urls = [
  "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
  "https://youtu.be/dQw4w9WgXcQ",
]
rejects_urls = [
  "https://youtube.com@evil.com/watch?v=dQw4w9WgXcQ",
  "http://169.254.169.254/latest/meta-data/",
]

# Not set in either option dict, so yt-dlp's player JS cache is left enabled.
cachedir = true

# YT_DLP_FORMAT_SORT: H.264 and AAC preferred over AV1 and VP9, as a -S
# preference rather than a filter.
codec_policy = "h264-preferred"

# YT_DLP_SOCKET_TIMEOUT, set at every call site.
socket_timeout_seconds = 30

# Settings.youtube_max_download_size. Unlike the sibling projects this one has
# a real ceiling: progress_hooks count bytes mid-transfer and the landed file
# is measured before it is accepted.
max_bytes = 8589934592

# The worker images install Deno (docker/Dockerfile.worker*). The frontend
# image deliberately has none: its only yt-dlp use is the flat playlist
# extraction, which needs no signature or n-challenge solving. Downloads only
# happen in the worker, so that is the image this answers for.
js_runtime = "deno"
js_runtime_provided_by = "image"

# yt-dlp-ejs is pinned in this file's own dependencies and checked against the
# installed yt-dlp by test_ejs_matches_the_installed_yt_dlp.
ejs_coupling = "pinned"

# YT_DLP_MARKERS_VERIFIED_AGAINST is "2026.08.19", but this key is compared
# against importlib.metadata.version("yt-dlp"), which normalises the zero --
# measured as "2026.8.19". The two spellings are the same release; copying the
# constant here verbatim fails the check.
markers_verified_against = "2026.8.19"

# No PO Token provider is configured and no code reads one.
po_token_hook = "absent"

# No player_client override.
player_clients = ["default"]

# ffmpeg merges the video and audio tracks; ffprobe reads durations in
# pipeline/audio_probe.py.
needs_ffmpeg = true
needs_ffprobe = true

# Counted by docs/ytdlp-conformance/check-conformance-drift.sh, not by
# anything in the test module. The entries are in tests/unit/conftest.py.
xfail_budget = 5

# Aspects this repository cannot meet, each citing an issue.
[tool.ytdlp_conformance.waivers]
C5 = "error-message content is not visible through the shared adapter; see fdff87554/youtube-downloader#140"
"C7.external" = "no download is driven as a subprocess, so there is nothing for this aspect to describe; see fdff87554/youtube-downloader#135"
"C7.landed" = "the landed file IS measured here (DownloadStage._guard_download_size), but not through the shared adapter; see fdff87554/youtube-downloader#140"
"C8.deadline" = "no wall-clock bound on a download; see #TBD"
